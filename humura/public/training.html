<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Training · Humura</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/pages.css"></head><body><div id="hdr"></div><main>
<h1>Training for frontline workers</h1>
<p><i>Prototype content. A nurse or social worker must review every lesson before use.</i></p>
<div id="L"></div>
</main><script src="js/common.js"></script>
<script>
var D=[
{t:'1. Spot the signs',x:'A woman or girl may be in danger if she has new injuries, fears going home, becomes silent, drops out of school or work, or seems very low after giving birth.',q:'A girl stops coming to school and looks afraid. What do you do first?',o:['Shout at her to explain','Speak to her privately and kindly','Tell the whole class'],a:1},
{t:'2. Listen safely',x:'Listen. Believe her. Do not blame. Keep it private. Ask what she needs. If a child is in danger, follow your referral rules.',q:'She tells you something painful. What do you say?',o:['Why did you stay?','I believe you. It is not your fault.','Maybe you misunderstood.'],a:1},
{t:'3. Refer, do not diagnose',x:'You are not a doctor. Refer to the nearest health facility when there is injury, danger, or thoughts of self-harm. Write down only what is needed.',q:'She says she has thoughts of harming herself. What do you do?',o:['Wait and see','Stay with her and take her to the health facility today','Give her medicine'],a:1}
];
document.getElementById('L').innerHTML=D.map(function(d,i){return '<div class="box"><h3>'+d.t+'</h3><p>'+d.x+'</p><p><b>'+d.q+'</b></p>'+d.o.map(function(o,j){return '<button class="btn" data-i="'+i+'" data-j="'+j+'">'+o+'</button> '}).join('')+'<p id="f'+i+'"></p></div>'}).join('');
document.querySelectorAll('[data-i]').forEach(function(b){b.onclick=function(){
  var d=D[b.dataset.i],ok=+b.dataset.j==d.a,f=document.getElementById('f'+b.dataset.i);
  f.className=ok?'ok':'ref';f.textContent=ok?'Correct. Well done.':'Not quite. Read the lesson again and try another answer.';
}});
</script></body></html>
