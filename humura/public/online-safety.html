<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Online safety · Humura</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/pages.css"></head><body><div id="hdr"></div><main>
<h1>Online safety</h1>
<p>Paste a message or comment that scares or hurts you. It is checked on your phone only. Nothing is sent or saved.</p>
<textarea id="t" rows="5" placeholder="Paste the message here"></textarea>
<p><button class="btn" id="go">Check</button></p>
<div id="out" class="box" hidden></div><div id="help" class="box warn" hidden></div>
</main><script src="js/common.js"></script><script src="js/safety-rules.js"></script>
<script>
var A={threat:'This looks like a threat.',selfharm:'This mentions hurting a life. Please talk to someone now.',blackmail:'This looks like blackmail or a threat to share your pictures.',sexual:'This looks like sexual harassment.',insult:'This looks like insults or bullying.'};
function steps(){return '<h3>What to do</h3><ol><li><b>Save proof:</b> take a screenshot with the date and sender. Do not delete it.</li><li><b>Do not reply</b> and do not meet this person.</li><li><b>Block</b> the sender and report the account on the app.</li><li><b>Tell a trusted adult</b> or a health worker. It is not your fault.</li></ol>'}
document.getElementById('go').onclick=function(){
  var r=scan(document.getElementById('t').value),o=document.getElementById('out');o.hidden=false;
  if(!r.length){o.innerHTML='<p>No known warning words found. If it makes you feel unsafe, trust your feeling and follow these steps.</p>'+steps();return}
  o.innerHTML='<ul>'+r.map(function(k){return '<li>'+A[k]+'</li>'}).join('')+'</ul>'+steps();
  if(r.some(function(k){return k!='insult'&&k!='sexual'}))showHelp(document.getElementById('help'));
};
</script></body></html>
